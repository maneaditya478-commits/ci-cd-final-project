apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: echo
spec:
  description: This task will echo the message.
  params:
    - name: message
      description: The message to echo
      type: string
  steps:
    - name: echo-message
      image: alpine:3
      command: [/bin/echo]
      args: ["$(params.message)"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: Cleans the shared source workspace before cloning
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi
        echo "Workspace cleaned successfully."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
spec:
  description: Clones a git repository into the shared workspace
  workspaces:
    - name: output
  params:
    - name: url
      type: string
      description: The git repository URL to clone
    - name: revision
      type: string
      default: "main"
      description: The git revision (branch, tag, commit) to checkout
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -e
        echo "Cloning $(params.url) (branch: $(params.revision)) into $(workspaces.output.path)..."
        git clone -b $(params.revision) $(params.url) $(workspaces.output.path)
        cd $(workspaces.output.path)
        git status
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8
spec:
  description: Runs flake8 linter on Python source code and test files
  workspaces:
    - name: source
  params:
    - name: image
      type: string
      default: "python:3.9-slim"
      description: The container image to run flake8
    - name: args
      type: string
      default: "service tests"
      description: Target directories to lint
  steps:
    - name: lint
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        echo "Installing flake8..."
        python -m pip install --upgrade pip
        pip install flake8
        echo "Running flake8 syntax check..."
        flake8 $(params.args) --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "Running flake8 complexity and style check..."
        flake8 $(params.args) --count --max-complexity=10 --max-line-length=127 --statistics
        echo "Flake8 linting passed successfully."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Runs unit tests using nosetests
  workspaces:
    - name: source
  params:
    - name: image
      type: string
      default: "python:3.9-slim"
      description: The container image to run tests
    - name: args
      type: string
      default: "-v --with-spec --spec-color --with-coverage --cover-package=service"
      description: Arguments passed to nosetests
    - name: database_uri
      type: string
      default: "sqlite:///test.db"
      description: Database URI for running tests
  steps:
    - name: nosetests
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      script: |
        #!/bin/bash
        set -e
        echo "Installing test dependencies..."
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        echo "Running nosetests..."
        nosetests $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tests
spec:
  description: Runs tests on Python source code
  workspaces:
    - name: source
  params:
    - name: image
      type: string
      default: "python:3.9-slim"
      description: Container image for tests
    - name: args
      type: string
      default: "-v --with-spec --spec-color"
      description: Arguments passed to test runner
    - name: database_uri
      type: string
      default: "sqlite:///test.db"
      description: Database connection URI
  steps:
    - name: nosetests
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
      script: |
        #!/bin/bash
        set -e
        echo "Installing dependencies..."
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        echo "Running tests..."
        nosetests $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: buildah
spec:
  description: Builds and pushes container image using buildah
  workspaces:
    - name: source
  params:
    - name: IMAGE
      type: string
      description: Reference of the image buildah will produce.
    - name: BUILDER_IMAGE
      type: string
      default: quay.io/buildah/stable:v1.23.3
      description: The location of the buildah builder image.
    - name: STORAGE_DRIVER
      type: string
      default: vfs
      description: Set buildah storage driver
    - name: DOCKERFILE
      type: string
      default: ./Dockerfile
      description: Path to the Dockerfile to build.
    - name: CONTEXT
      type: string
      default: .
      description: Path to the directory to use as context.
    - name: TLSVERIFY
      type: string
      default: "false"
      description: Verify the TLS on the registry endpoint
  steps:
    - name: build
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        echo "Building container image $(params.IMAGE)..."
        buildah --storage-driver=$(params.STORAGE_DRIVER) bud \
          --no-cache -f $(params.DOCKERFILE) -t $(params.IMAGE) $(params.CONTEXT)
    - name: push
      image: $(params.BUILDER_IMAGE)
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        echo "Pushing container image $(params.IMAGE)..."
        buildah --storage-driver=$(params.STORAGE_DRIVER) push \
          --tls-verify=$(params.TLSVERIFY) $(params.IMAGE) docker://$(params.IMAGE)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  description: Deploys application to OpenShift/Kubernetes using openshift-client
  workspaces:
    - name: manifest-dir
  params:
    - name: image
      type: string
      description: The container image to deploy
    - name: app_name
      type: string
      default: "accounts"
      description: The name of the application deployment
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.manifest-dir.path)
      script: |
        #!/bin/bash
        set -e
        echo "Updating manifest with image $(params.image)..."
        if [ -f deploy/deployment.yaml ]; then
          sed -i "s|IMAGE_NAME_HERE|$(params.image)|g" deploy/deployment.yaml
          cat deploy/deployment.yaml
          echo "Deploying to OpenShift..."
          oc apply -f deploy/
          oc get pods -l app=$(params.app_name)
        else
          echo "deploy/deployment.yaml not found. Creating deployment with oc..."
          if ! oc get deployment $(params.app_name) > /dev/null 2>&1; then
            oc create deployment $(params.app_name) --image=$(params.image)
            oc expose deployment $(params.app_name) --port=8080 --target-port=8080
          else
            oc set image deployment/$(params.app_name) $(params.app_name)=$(params.image)
          fi
          oc rollout status deployment/$(params.app_name) --timeout=180s
        fi
        echo "Application $(params.app_name) deployed successfully."
